services:
  - type: web
    name: niramaya-health-ai
    runtime: python
    plan: free
    rootDir: niramaya
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 45 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
